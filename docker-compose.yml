services:
  db:
    image: postgres:16-alpine
    container_name: pricing-db
    environment:
      POSTGRES_DB: pricingdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pricing-backend
    environment:
      PORT: 4000
      DATABASE_URL: postgres://postgres:postgres@db:5432/pricingdb
      JWT_SECRET: local-dev-secret-change-me
    depends_on:
      - db
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pricing-frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  db_data:
